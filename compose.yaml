services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_pass_2026
      POSTGRES_DB: qa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: