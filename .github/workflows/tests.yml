name: Python QA Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_pass_2026
          POSTGRES_DB: qa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d qa_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov "psycopg[binary]" allure-pytest playwright selenium

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium


      - name: Run tests
        run: pytest -v --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 14